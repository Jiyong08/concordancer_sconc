[package]
name = "sconc"
version = "0.1.0"
edition = "2021"
description = "sconc: Korean Diachronic & Synchronic Multi-Layer Corpus Concordancer"
authors = ["Jiyong"]

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
sysinfo = "0.30"
tiny_http = "0.12"
urlencoding = "2.1"
