[package]
name = "sconc"
version = "0.2.0"
edition = "2021"
description = "sconc: Korean Diachronic & Synchronic Multi-Layer Corpus Concordancer"
authors = ["Jiyong"]

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
sysinfo = "0.30"
urlencoding = "2.1"
tao = "0.37"
wry = "0.57"
http = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "sconc"
path = "src/main.rs"
