name: Build and Release S-conc (Windows & macOS)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run unit tests
        working-directory: engine
        run: cargo test

      - name: Build release binary
        working-directory: engine
        run: cargo build --release

      - name: Stage Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item engine/target/release/sconc.exe dist/sconc-Windows.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: sconc-Windows
          path: dist/sconc-Windows.exe

  build-macos:
    name: Build macOS Universal (.app)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (arm64 + x86_64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Run unit tests
        working-directory: engine
        run: cargo test

      - name: Build release binary (Apple Silicon & Intel)
        working-directory: engine
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Package S-conc.app Universal Bundle
        run: |
          mkdir -p dist/S-conc.app/Contents/MacOS
          mkdir -p dist/S-conc.app/Contents/Resources

          # Universal Binary (Apple Silicon + Intel)
          lipo -create \
            engine/target/aarch64-apple-darwin/release/sconc \
            engine/target/x86_64-apple-darwin/release/sconc \
            -output dist/S-conc.app/Contents/MacOS/sconc
          chmod +x dist/S-conc.app/Contents/MacOS/sconc

          # Build .icns from assets/icon.png
          mkdir -p icon.iconset
          sips -z 16 16     assets/icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     assets/icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     assets/icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   assets/icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   assets/icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/icon.png --out icon.iconset/icon_512x512.png
          cp assets/icon.png icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o dist/S-conc.app/Contents/Resources/icon.icns
          rm -rf icon.iconset

          cat > dist/S-conc.app/Contents/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>S-conc</string>
            <key>CFBundleDisplayName</key>
            <string>S-conc</string>
            <key>CFBundleIdentifier</key>
            <string>com.sconc.concordancer</string>
            <key>CFBundleVersion</key>
            <string>0.2.0</string>
            <key>CFBundleShortVersionString</key>
            <string>0.2.0</string>
            <key>CFBundleExecutable</key>
            <string>sconc</string>
            <key>CFBundleIconFile</key>
            <string>icon.icns</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
          </dict>
          </plist>
          EOF

          cd dist
          ditto -c -k --sequesterRsrc --keepParent S-conc.app S-conc-macOS-Universal.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: S-conc-macOS-Universal
          path: dist/S-conc-macOS-Universal.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten asset paths
        run: |
          mkdir -p final-assets
          cp release-assets/sconc-Windows/sconc-Windows.exe final-assets/
          cp release-assets/S-conc-macOS-Universal/S-conc-macOS-Universal.zip final-assets/

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'S-conc v0.2 (Windows & macOS)' }}
          generate_release_notes: true
          make_latest: true
          files: |
            final-assets/sconc-Windows.exe
            final-assets/S-conc-macOS-Universal.zip
